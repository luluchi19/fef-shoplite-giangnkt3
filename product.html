<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShopLite — View detailed product information, pricing, and reviews.">
  <title>ShopLite — Product Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═══════════ NAVBAR ═══════════ -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="navbar__logo" id="logo">
        <i class="fa-solid fa-bolt"></i>
        <span>ShopLite</span>
      </a>

      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
      </button>

      <nav class="nav-menu" id="nav-menu">
        <a href="index.html" class="nav-menu__link" id="nav-home">
          <i class="fa-solid fa-house"></i> Home
        </a>
        <a href="cart.html" class="nav-menu__link nav-menu__link--cart" id="nav-cart-link">
          <i class="fa-solid fa-shopping-cart"></i> Cart
          <span id="cart-badge">0</span>
        </a>
        <a href="register.html" class="nav-menu__link" id="nav-register">
          <i class="fa-solid fa-user-plus"></i> Register
        </a>
      </nav>
    </div>
  </header>

  <main>
    <!-- Page Header -->
    <section class="page-header">
      <div class="container">
        <nav class="page-header__breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <i class="fa-solid fa-chevron-right" style="font-size: 0.6rem;"></i>
          <span>Product Detail</span>
        </nav>
        <h1 class="page-header__title" id="page-title">Product Detail</h1>
      </div>
    </section>

    <!-- Loading State -->
    <div class="loading-state" id="loading-state">
      <div class="spinner"></div>
      <p>Loading product details...</p>
    </div>

    <!-- Error State -->
    <div class="error-state" id="error-state" style="display: none;">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <p class="error-message">Failed to load product details.</p>
      <a href="index.html" class="btn btn--primary">
        <i class="fa-solid fa-arrow-left"></i> Back to Shop
      </a>
    </div>

    <!-- Product Detail -->
    <section class="section">
      <div class="container">
        <div class="product-detail" id="product-detail" style="display: none;">
          <!-- Product detail rendered here by JS -->
        </div>
      </div>
    </section>
  </main>

  <!-- ═══════════ FOOTER ═══════════ -->
  <footer class="footer">
    <div class="container">
      <div class="footer__bottom">
        <p>&copy; 2026 ShopLite. All rights reserved.</p>
        <div class="footer__socials">
          <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
          <a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
          <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
          <a href="#" aria-label="Github"><i class="fa-brands fa-github"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
